name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tests on Windows (paths, line endings)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: |
          python -m pip install pyserial pytest PySide6
          python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install ruff
          ruff check .
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Run the flasher test suite (simulated CAN bus, signing, integrity)
        run: |
          python -m pip install pyserial pytest
          python -m pytest -q tests
      - name: Install Qt runtime libraries for the headless GUI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run the Qt Quick tests and the end-to-end Qt checks (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install PySide6
          python -m pytest -q tests
          python verify_qt_device_config.py
          python verify_qt_swd_full_chip_flash.py
          python verify_qt_can_options.py
