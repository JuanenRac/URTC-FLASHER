# Type check of the program (python -m mypy). The window code (qt_flasher.py) is left out of the check on purpose: it talks to Qt with many
# untyped objects and is covered by the offscreen tests instead; everything else, including the copies of the shared code, is checked.
[mypy]
files = urtc_can, urtc_ui, flasher_*.py, urtc_flasher.py
ignore_missing_imports = True

[mypy-qt_flasher]
ignore_errors = True

# The Qt objects shared with the other programs: checked in URTC-COMMON without Qt installed; with PySide6 present its stubs reject the string type of a list property.
[mypy-urtc_can.help_qt,urtc_can.node_picker_qt,urtc_can.update_qt]
ignore_errors = True
